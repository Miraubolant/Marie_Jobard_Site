services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3333"
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=3333"
    environment:
      - SERVICE_FQDN_APP_3333
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=marie_jobard
      - SESSION_DRIVER=cookie
      - TZ=Europe/Paris
      - LOG_LEVEL=info
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3333/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marie_jobard
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marie_jobard"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  coolify:
    external: true

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
